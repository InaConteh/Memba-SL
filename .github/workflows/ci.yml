name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  db:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Postgres only; applies supabase/migrations
      - run: npx supabase db start
      # On failure, repeat the failing lines as an annotation: job logs need a
      # signed-in account, annotations don't
      - name: Run pgTAP
        run: |
          set +e
          npx supabase test db 2>&1 | tee pgtap.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E '^(not ok|#|Failed|Parse errors|Result|psql|ERROR)|Wstat|Bad plan|Dubious' pgtap.log | head -80 \
              | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=supabase test db failed::${msg:-see job log}"
          fi
          exit "$status"
